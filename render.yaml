services:
  - type: web
    name: primo-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Public URLs, not secrets: they belong in version control rather than in a box
      # someone has to remember to fill in. API_URL was left empty in the dashboard, so it
      # fell back to its localhost default and every verification link mailed in production
      # pointed at the recipient's own machine.
      - key: CLIENT_URL
        value: https://prim-o-coral.vercel.app
      - key: API_URL
        value: https://primo-backend-ec20.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TOKEN_PRICE_CENTS
        value: "100"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: "Prim'O"
